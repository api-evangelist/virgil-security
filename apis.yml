aid: virgil-security
name: Virgil Security
description: >-
  Virgil Security is an end-to-end encryption and key-management platform for
  developers. It ships client SDKs and JWT-authenticated cloud services that let
  applications add end-to-end encryption for messaging and files (E3Kit),
  breach-proof password and data protection using Password-Hardened Encryption
  and the Pythia PRF protocol (PureKit), secure private-key storage and sync
  (Keyknox), Double Ratchet perfect-forward-secrecy messaging (Ratchet), and IoT
  device security and provisioning (IoTKit). The platform's Virgil Cards service
  manages public keys and identities, and its cryptography runs client-side so
  providers never hold plaintext, helping teams meet HIPAA, GDPR and PCI DSS
  requirements. SDKs are published for JavaScript/TypeScript, Python, Go, Java,
  Swift, PHP, Ruby, .NET and C/C++, with a Go CLI for account and key management.
