notes: >-
  Cross-cutting semantics for the Virgil Cloud service APIs, captured from the
  developer documentation (no OpenAPI is published). Virgil is a
  key-management / end-to-end-encryption platform: most of the security work
  (encrypt / decrypt / sign / verify) happens client-side in the SDKs, and the
  cloud services are thin, JWT-authenticated endpoints (Cards, Keyknox, Pythia,
  PFS). No documented idempotency-key contract, cursor pagination, or field
  expansion was found, so those are recorded as not-applicable rather than
  fabricated.
