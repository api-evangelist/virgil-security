notes: >-
  First-party Virgil Security client libraries confirmed live on the public
  registries (npm, PyPI, RubyGems, Packagist) and in the VirgilSecurity GitHub
  org. Virgil ships a layered SDK family: low-level Crypto libraries, the Core
  SDK (Virgil Cards / key management), and product frameworks (E3Kit end-to-end
  encryption, PureKit / PHE password protection, Pythia, Keyknox, Ratchet).
